# examples/manifest.yaml — catalog of mock projects for specwiki demos and specwiki.ai live examples.
#
# Schema:
#   hero: string              — slug of the primary live example (must match a catalog entry)
#   unpublished: string[]     — optional; example folders kept on disk but not in the live catalog/gallery
#   examples: array           — published mock projects under examples/<slug>/
#     - slug: string          — directory name under examples/ (kebab-case)
#       title: string         — short display name
#       tagline: string       — one-line description for gallery cards and README tables
#       framework: string      — workflow label (agent-harness | speckit | bmad | …)
#       commands:              — optional; required on the hero entry for docs parity
#         generate: string     — full generate command from repo root
#         open: string        — full open command from repo root
#       landing:               — optional; hero only until S27.4 wires build-time injection
#         section_title: string
#         section_prose: string
#
# Sync point (v1): build:site injects §04 section-title and section-prose from
# hero.examples[].landing in this manifest (S27.4). Source site/index.html
# keeps matching defaults for local preview; built output is authoritative.
#
# Deploy (and `build:examples -- --all`) generates every catalog entry plus the
# gallery hub at examples/index.html (S27.3). Local default remains --hero-only.

hero: agent-harness-parcel

# Folders under examples/ kept for local generate/open demos; not listed in the
# live gallery and not built by `build:examples -- --all`.
unpublished:
  - article-research-mycelium

examples:
  - slug: agent-harness-parcel
    title: Agent harness parcel
    tagline: Basic example with minimal agent-harness files
    framework: agent-harness
    commands:
      generate: npx @lucasviola/specwiki generate --project examples/agent-harness-parcel
      open: npx @lucasviola/specwiki open --project examples/agent-harness-parcel
    landing:
      section_title: Three root files in. A browsable wiki out.
      section_prose: >-
        examples/agent-harness-parcel is a minimal agent harness — the three root
        files many AI tools read first. Point specwiki at it (from the specwiki repo root):

  - slug: speckit-harness-parcel
    title: Spec Kit parcel
    tagline: The same parcel mock example built with speckit
    framework: speckit
    commands:
      generate: npx @lucasviola/specwiki generate --project examples/speckit-harness-parcel
      open: npx @lucasviola/specwiki open --project examples/speckit-harness-parcel

  - slug: openspec-harness-parcel
    title: OpenSpec parcel
    tagline: The same parcel mock example built with OpenSpec
    framework: openspec
    commands:
      generate: npx @lucasviola/specwiki generate --project examples/openspec-harness-parcel
      open: npx @lucasviola/specwiki open --project examples/openspec-harness-parcel

  - slug: kiro-harness-parcel
    title: Kiro parcel
    tagline: The same parcel mock example built with Kiro
    framework: kiro
    commands:
      generate: npx @lucasviola/specwiki generate --project examples/kiro-harness-parcel
      open: npx @lucasviola/specwiki open --project examples/kiro-harness-parcel

  - slug: bmad-harness-parcel
    title: BMAD parcel
    tagline: The same parcel mock example built with BMAD
    framework: bmad
    commands:
      generate: npx @lucasviola/specwiki generate --project examples/bmad-harness-parcel
      open: npx @lucasviola/specwiki open --project examples/bmad-harness-parcel
