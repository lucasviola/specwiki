<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="[[specwiki]]">
  <title>[[specwiki]] blog default hero</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f7fc"/>
      <stop offset="100%" stop-color="#e8eef8"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect x="48" y="48" width="864" height="444" rx="12" fill="#ffffff" stroke="#c8d6f0" stroke-width="2"/>
  <text
