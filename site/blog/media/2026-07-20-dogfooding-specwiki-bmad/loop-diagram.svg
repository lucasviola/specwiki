<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="Build, write specs, generate wiki, read and understand">
  <title>The dogfooding loop: build, specs, wiki, understand</title>
  <rect width="800" height="320" fill="#f8f9fa"/>
  <!-- Step 1: Build -->
  <rect x="24" y="96" width="140" height="128" rx="8" fill="#ffffff" stroke="#3366cc" stroke-width="2"/>
  <text x="94" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#202122">Build</text>
  <text x="94" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#54595d">ship the feature</text>
  <!-- Arrow -->
  <path d="M 172 160 L 208 160" stroke="#3366cc" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 2: Specs -->
  <rect x="216" y="96" width="140" height="128" rx="8" fill="#ffffff" stroke="#a2a9b1" stroke-width="2"/>
  <text x="286" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#202122">Specs</text>
  <text x="286" y="168" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#54595d">ADRs · stories</text>
  <text x="286" y="188" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#54595d">architecture</text>
  <!-- Arrow -->
  <path d="M 364 160 L 400 160" stroke="#3366cc" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 3: Generate -->
  <rect x="408" y="96" width="140" height="128" rx="8" fill="#ffffff" stroke="#3366cc" stroke-width="2"/>
  <text x="478" y="148" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#202122">
    <tspan fill="#3366cc">[[</tspan>specwiki<tspan fill="#3366cc">]]</tspan>
  </text>
  <text x="478" y="176" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#54595d">generate wiki</text>
  <!-- Arrow -->
  <path d="M 556 160 L 592 160" stroke="#3366cc" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 4: Understand -->
  <rect x="600" y="96" width="176" height="128" rx="8" fill="#ffffff" stroke="#3366cc" stroke-width="2"/>
  <text x="688" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#202122">Understand</text>
  <text x="688" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#54595d">decisions · scope</text>
  <text x="688" y="188" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#54595d">what shipped</text>
  <!-- Loop back -->
  <path d="M 688 232 Q 400 300 94 232" fill="none" stroke="#c8d6f0" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="400" y="292" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#3366cc" font-weight="600">repeat at the end of every feature</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#3366cc"/>
    </marker>
  </defs>
</svg>
